name: Live evals

# Deliberately workflow_dispatch ONLY. This job runs live model sessions with the
# repository's ANTHROPIC_API_KEY; it must never be triggerable by a fork PR.
on:
  workflow_dispatch:
    inputs:
      skill:
        description: Which skill or plugin group to evaluate
        type: choice
        options: [all, overclock-setup, session-memory, learning-loop, discipline-gates, setup, session-handoff, lessons-learned, test-discipline, git-archaeologist, natural-writing, critical-thinking, independent-research]
        default: all
      compare_baseline:
        description: Also run the same cases with all skills disabled
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run live eval suite
        env:
          SKILL: ${{ inputs.skill }}
          COMPARE_BASELINE: ${{ inputs.compare_baseline }}
        run: |
          run_suite() {
            local status=0
            bash qa/run_evals.sh "$@" || status=$?
            if [ "$COMPARE_BASELINE" = "true" ]; then
              BASELINE=1 bash qa/run_evals.sh "$@" || return $?
            fi
            return "$status"
          }
          case "$SKILL" in
            all)
              run_suite overclock-setup/setup session-memory/session-handoff session-memory/lessons-learned learning-loop/lessons-learned discipline-gates/test-discipline discipline-gates/git-archaeologist natural-writing/natural-writing critical-thinking/critical-thinking critical-thinking/independent-research
              ;;
            overclock-setup|setup)
              run_suite overclock-setup/setup
              ;;
            session-memory)
              run_suite session-memory/session-handoff session-memory/lessons-learned
              ;;
            learning-loop)
              run_suite learning-loop/lessons-learned
              ;;
            discipline-gates)
              run_suite discipline-gates/test-discipline discipline-gates/git-archaeologist
              ;;
            session-handoff)
              run_suite session-memory/session-handoff
              ;;
            lessons-learned)
              run_suite session-memory/lessons-learned
              ;;
            test-discipline|git-archaeologist)
              run_suite "discipline-gates/$SKILL"
              ;;
            natural-writing)
              run_suite natural-writing/natural-writing
              ;;
            critical-thinking)
              run_suite critical-thinking/critical-thinking critical-thinking/independent-research
              ;;
            independent-research)
              run_suite critical-thinking/independent-research
              ;;
          esac

      - name: Job summary
        if: always()
        run: python3 qa/summarize_eval_results.py qa/_work/results >> "$GITHUB_STEP_SUMMARY"

      - name: Upload transcripts and gradings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-artifacts
          path: qa/_work/results/
          retention-days: 30
