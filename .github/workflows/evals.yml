name: Live evals

# Deliberately workflow_dispatch ONLY. This job runs live model sessions with the
# repository's ANTHROPIC_API_KEY; it must never be triggerable by a fork PR.
on:
  workflow_dispatch:
    inputs:
      skill:
        description: Which skill to evaluate
        type: choice
        options: [both, session-handoff, lessons-learned, test-discipline, git-archaeologist, natural-writing]
        default: both

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run live eval suite
        env:
          SKILL: ${{ inputs.skill }}
        run: |
          if [ "$SKILL" = "both" ]; then
            bash qa/run_evals.sh
          else
            bash qa/run_evals.sh "$SKILL"
          fi

      - name: Job summary
        if: always()
        run: |
          {
            echo '## Live eval results'
            for g in qa/_work/results/*/grading.json; do
              [ -f "$g" ] || continue
              name=$(basename "$(dirname "$g")")
              python3 -c "import json;g=json.load(open('$g'));print(f'- **$name**: {g[\"passed\"]}/{g[\"total\"]}')"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload transcripts and gradings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-artifacts
          path: qa/_work/results/
          retention-days: 30
