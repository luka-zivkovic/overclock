name: casefile

on:
  push:
    branches: [master]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Casefile
        run: npm install -g casefile@0.2.1
      - name: Scan marketplace
        run: |
          scan_root="${RUNNER_TEMP}/overclock-scan"
          mkdir -p "$scan_root"
          git archive HEAD | tar -x -C "$scan_root"
          casefile scan "$scan_root" --config "$scan_root/casefile.config.json" --json --out casefile-report.json --fail-on warning --no-store
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casefile-report
          path: casefile-report.json
